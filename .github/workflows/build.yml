name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Build the shaded jar
        run: ./gradlew shadowJar --no-daemon

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: koneko-web
          path: build/libs/koneko-web-shaded.jar
