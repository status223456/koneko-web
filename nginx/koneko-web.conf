# =====================================================================
#  koneko-web  ->  127.0.0.1:8300
# ---------------------------------------------------------------------
#  Replace every example.com with your own domain and every path under
#  /path/to/ with your own paths, then include this file from nginx.conf
#  (or paste the two server blocks into your existing config).
#
#  IMPORTANT: the apex name must NOT appear in the server_name list of
#  the bancho.jar block. Two blocks cannot claim the same name - nginx
#  silently keeps the first one it read. The subdomains the game client
#  uses (c*, osu., api.) stay on bancho.jar untouched.
#
#  The wildcard certificate that bancho.jar already uses covers this,
#  nothing new has to be issued.
# =====================================================================

upstream koneko_frontend {
    server 127.0.0.1:8300;   # PORT from .env
    keepalive 32;
}

# ---- www -> apex, so there is one canonical address ----
server {
    listen 443 ssl;
    server_name www.example.com;

    ssl_certificate     /path/to/ssl/fullchain.pem;
    ssl_certificate_key /path/to/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://example.com$request_uri;
}

# =====================================================================
#  The site itself
# =====================================================================
server {
    listen 443 ssl;
    server_name example.com;

    client_max_body_size 10M;

    ssl_certificate     /path/to/ssl/fullchain.pem;
    ssl_certificate_key /path/to/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /path/to/logs/koneko_access.log;
    error_log  /path/to/logs/koneko_error.log;

    location = /account/avatar {
        client_max_body_size 5M;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://koneko_frontend;
    }

    location / {
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $http_host;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # No Access-Control-Allow-Origin here on purpose: the browser only
        # ever talks to its own origin, and a wildcard CORS header would
        # break the session cookie.
        proxy_redirect off;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_pass http://koneko_frontend;
    }

    # The css ships inside the jar and only changes between builds.
    location /css/ {
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://koneko_frontend;

        expires 7d;
        add_header Cache-Control "public";
    }

    # Per user data, must never be cached by a proxy.
    location /data/ {
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://koneko_frontend;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
